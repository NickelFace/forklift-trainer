<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11161c">
<title>Forklift TLILIC0003 — тренажёр</title>
<style>
:root{
  --bg:#11161c; --panel:#1a222b; --panel2:#222c37; --line:#2e3a47;
  --txt:#e7edf3; --dim:#9aa9b8; --acc:#f0b429; --ok:#3fb950; --bad:#f2555a; --blue:#58a6ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:.5px}
h1 b{color:var(--acc)}
.sub{color:var(--dim);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.q{font-size:19px;font-weight:600;line-height:1.4}
.meta{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.ans{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);white-space:pre-wrap}
.ru{margin-top:12px;color:var(--dim);font-size:14.5px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:11px 16px;border-radius:8px;cursor:pointer;font-size:15px}
button.b:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
button.good{background:rgba(63,185,80,.15);border-color:var(--ok);color:var(--ok)}
button.hard{background:rgba(242,85,90,.13);border-color:var(--bad);color:var(--bad)}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
     padding:12px 14px;border-radius:9px;margin-top:8px;cursor:pointer;font-size:15.5px}
.opt:hover{border-color:var(--blue)}
.opt.correct{background:rgba(63,185,80,.16);border-color:var(--ok)}
.opt.wrong{background:rgba(242,85,90,.16);border-color:var(--bad)}
.opt b{color:var(--dim);margin-right:8px}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;color:var(--dim)}
select,input[type=text]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;max-width:100%}
.list-item{border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.list-item:last-child{border:0}
.list-item .t{font-weight:600;font-size:15.5px}
.list-item .d{color:var(--dim);font-size:13.5px;margin-top:6px;display:none;white-space:pre-wrap}
.list-item.open .d{display:block}
.hint{color:var(--dim);font-size:13px;margin-top:10px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin-left:6px}
.timer{float:right;color:var(--dim);font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:700;text-align:center;margin:10px 0}
.center{text-align:center}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
code{background:var(--panel2);border-radius:4px;padding:1px 5px;font-size:13.5px}
textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;font:15px/1.5 inherit;min-height:90px}
@media(max-width:520px){.q{font-size:17px}nav button{flex:1 1 40%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Forklift <b>TLILIC0003</b> — тренажёр</h1>
  <span class="sub">68 экзаменационных вопросов + 60 тестовых</span>
</header>

<nav>
  <button data-m="home" class="on">Прогресс</button>
  <button data-m="cards">Карточки</button>
  <button data-m="exam">Экзамен</button>
  <button data-m="mistakes">Ошибки</button>
  <button data-m="list">Все вопросы</button>
</nav>

<div id="app"></div>
</div>

<script>
let DATA, QUIZ, MC;
const KEY = 'forklift_tlilic0003_v1';
const DAY = 864e5;
const BOX = [0, 1, 3, 7, 21];   // интервалы повторения в днях по коробкам Лейтнера

let S = load();
function load(){
  try{ return Object.assign({cards:{}, mc:{}, exams:[]}, JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ return {cards:{}, mc:{}, exams:[]}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const app = document.getElementById('app');
let mode='home', ctx={};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m; ctx={}; render();
});

/* ---------- прогресс ---------- */
function st(id){ return S.cards[id] || {box:0, seen:0, wrong:0, due:0}; }
function due(id){ const c=st(id); return c.seen===0 || Date.now() >= c.due; }
function rate(id, good){
  const c = st(id); c.seen++;
  if(good){ c.box = Math.min(c.box+1, BOX.length-1); }
  else { c.box = 1; c.wrong++; }
  c.due = Date.now() + BOX[c.box]*DAY;
  S.cards[id]=c; save();
}
const learned = () => QUIZ.filter(q=>st(q.id).box>=3).length;

/* ---------- главный экран ---------- */
function home(){
  const seen = QUIZ.filter(q=>st(q.id).seen>0).length;
  const dueN = QUIZ.filter(q=>due(q.id)).length;
  const mcWrong = Object.values(S.mc).filter(x=>x.wrong>0).length;
  const last = S.exams.slice(-5).reverse();
  app.innerHTML = `
  <div class="card">
    <div class="meta">Открытые вопросы (68)</div>
    <div class="bar"><i style="width:${Math.round(learned()/QUIZ.length*100)}%"></i></div>
    <div class="hint">Выучено ${learned()} из ${QUIZ.length} · пройдено хотя бы раз: ${seen}</div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>${dueN}</b><span>к повторению</span></div>
      <div class="stat"><b>${learned()}</b><span>в памяти</span></div>
      <div class="stat"><b>${mcWrong}</b><span>ошибок в тесте</span></div>
      <div class="stat"><b>${S.exams.length}</b><span>экзаменов</span></div>
    </div>
    <div class="row">
      <button class="b primary" onclick="go('cards')">Учить карточки</button>
      <button class="b" onclick="go('exam')">Сдать экзамен</button>
    </div>
  </div>
  <div class="card">
    <div class="meta">Как этим пользоваться</div>
    <p><b>Карточки</b> — вспоминаешь ответ вслух, потом открываешь эталон. Оценка «Знаю» отодвигает карточку
    на 1 → 3 → 7 → 21 день, «Повторить» возвращает её в начало. Русский текст — только для понимания,
    на экзамене отвечать нужно английскими формулировками.</p>
    <p><b>Экзамен</b> — 30 случайных вопросов с вариантами ответа, порог 80 %. Ошибки автоматически
    падают в раздел «Ошибки».</p>
    <div class="hint">Прогресс хранится в этом браузере. <a href="#" onclick="reset();return false" style="color:var(--bad)">Сбросить всё</a></div>
  </div>
  ${last.length?`<div class="card"><div class="meta">Последние экзамены</div>${
    last.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <b style="color:${e.pct>=80?'var(--ok)':'var(--bad)'}">${e.pct}%</b>
      <span class="sub"> — ${e.right}/${e.total}, ${new Date(e.t).toLocaleString('ru-RU')}</span></div>`).join('')
  }</div>`:''}`;
}
function go(m){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); mode=m; ctx={}; render(); }
function reset(){ if(confirm('Удалить весь прогресс?')){ S={cards:{},mc:{},exams:[]}; save(); render(); } }

/* ---------- карточки ---------- */
function cards(){
  if(!ctx.queue){
    const secs = [...new Set(QUIZ.map(q=>q.section))];
    const f = ctx.sec || 'all';
    let pool = QUIZ.filter(q=> f==='all' || q.section===f);
    let q = pool.filter(x=>due(x.id));
    if(!q.length) q = pool.slice();
    ctx.queue = shuffle(q); ctx.i=0; ctx.show=false; ctx.secs=secs;
  }
  const secSel = `<select onchange="ctx={sec:this.value};render()">
      <option value="all">Все разделы</option>
      ${ctx.secs.map(s=>`<option ${ctx.sec===s?'selected':''}>${esc(s)}</option>`).join('')}
    </select>`;
  if(ctx.i >= ctx.queue.length){
    app.innerHTML = `<div class="card center"><div class="big">✓</div>
      <p>Круг пройден — ${ctx.queue.length} карточек.</p>
      <div class="row" style="justify-content:center">
        <button class="b primary" onclick="ctx={sec:ctx.sec};render()">Ещё круг</button>
        <button class="b" onclick="go('exam')">К экзамену</button></div></div>`;
    return;
  }
  const q = ctx.queue[ctx.i], c = st(q.id);
  app.innerHTML = `
  <div class="card">
    <div class="meta">${esc(q.section)} · вопрос ${q.n}
      <span class="badge">коробка ${c.box}/4</span>
      <span class="timer">${ctx.i+1} / ${ctx.queue.length}</span></div>
    <div class="q">${esc(q.q)}</div>
    ${ctx.show ? `<div class="ans">${esc(q.a_en)}</div>
      ${ctx.ru?`<div class="ru">${esc(q.a_ru)}</div>`
             :`<div class="row"><button class="b" onclick="ctx.ru=1;render()">Показать русский</button></div>`}
      <div class="row">
        <button class="b good" onclick="ansCard(1)">Знаю &nbsp;<kbd>1</kbd></button>
        <button class="b hard" onclick="ansCard(0)">Повторить &nbsp;<kbd>2</kbd></button>
      </div>`
    : `<div class="row"><button class="b primary" onclick="ctx.show=1;render()">Показать ответ &nbsp;<kbd>пробел</kbd></button></div>
       <div class="hint">Сначала сформулируй ответ вслух по-английски — так он запоминается, а не узнаётся.</div>`}
  </div>
  <div class="card">${secSel}</div>`;
}
function ansCard(good){ rate(ctx.queue[ctx.i].id, good); ctx.i++; ctx.show=false; ctx.ru=0; render(); }

/* ---------- экзамен ---------- */
function exam(){
  if(!ctx.set){
    app.innerHTML = `<div class="card">
      <div class="meta">Экзамен</div>
      <p>30 случайных вопросов с вариантами ответа. Проходной балл — 80 % (24 из 30).
      Ответ подсвечивается сразу, разбор — в конце.</p>
      <div class="row">
        <button class="b primary" onclick="startExam(30)">Начать 30 вопросов</button>
        <button class="b" onclick="startExam(60)">Все 60</button>
        <button class="b" onclick="startExam(10)">Быстрые 10</button>
      </div></div>`;
    return;
  }
  if(ctx.done) return examResult();
  const q = ctx.set[ctx.i], picked = ctx.answers[ctx.i];
  const secs = Math.round((Date.now()-ctx.t0)/1000);
  app.innerHTML = `
  <div class="card">
    <div class="meta">${esc(q.topic)}
      <span class="timer">${ctx.i+1} / ${ctx.set.length} · ${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div style="margin-top:14px">
      ${q.options.map((o,j)=>{
        let cls='';
        if(picked!=null) cls = j===q.correct ? 'correct' : (j===picked ? 'wrong':'');
        return `<button class="opt ${cls}" onclick="pick(${j})" ${picked!=null?'disabled':''}>
          <b>${'ABCD'[j]}</b>${esc(o)}</button>`;
      }).join('')}
    </div>
    ${picked!=null?`<div class="ru">${picked===q.correct?'✓ Верно. ':'✗ Правильный ответ — '+'ABCD'[q.correct]+'. '}${esc(q.explain_ru)}</div>
      <div class="row"><button class="b primary" onclick="nextQ()">${ctx.i+1<ctx.set.length?'Дальше':'Результат'}</button></div>`:''}
  </div>`;
}
function startExam(n){ ctx.set = shuffle(MC.slice()).slice(0,n); ctx.answers=[]; ctx.i=0; ctx.t0=Date.now(); ctx.done=false; render(); }
function pick(j){
  const q = ctx.set[ctx.i]; ctx.answers[ctx.i]=j;
  const m = S.mc[q.id] || {seen:0, wrong:0}; m.seen++; if(j!==q.correct) m.wrong++; else m.wrong=Math.max(0,m.wrong-1);
  S.mc[q.id]=m; save(); render();
}
function nextQ(){ if(ctx.i+1<ctx.set.length){ctx.i++;} else {ctx.done=true; finishExam();} render(); }
function finishExam(){
  const right = ctx.set.filter((q,i)=>ctx.answers[i]===q.correct).length;
  ctx.right=right; ctx.pct=Math.round(right/ctx.set.length*100);
  S.exams.push({t:Date.now(), right, total:ctx.set.length, pct:ctx.pct}); save();
}
function examResult(){
  const pass = ctx.pct>=80;
  app.innerHTML = `<div class="card center">
    <div class="big" style="color:${pass?'var(--ok)':'var(--bad)'}">${ctx.pct}%</div>
    <p>${ctx.right} из ${ctx.set.length} · ${pass?'сдано':'не сдано (нужно 80 %)'}</p>
    <div class="row" style="justify-content:center">
      <button class="b primary" onclick="ctx={};render()">Ещё раз</button>
      <button class="b" onclick="go('mistakes')">Разобрать ошибки</button></div>
  </div>
  <div class="card"><div class="meta">Разбор</div>
    ${ctx.set.map((q,i)=>{
      const ok = ctx.answers[i]===q.correct;
      return `<div class="list-item" onclick="this.classList.toggle('open')">
        <div class="t">${ok?'✓':'✗'} ${esc(q.q)}</div>
        <div class="d"><b style="color:var(--ok)">${'ABCD'[q.correct]}. ${esc(q.options[q.correct])}</b>
        ${ok?'':`<br><span style="color:var(--bad)">Твой ответ: ${ctx.answers[i]==null?'—':'ABCD'[ctx.answers[i]]+'. '+esc(q.options[ctx.answers[i]])}</span>`}
        <br>${esc(q.explain_ru)}</div></div>`;
    }).join('')}
  </div>`;
}

/* ---------- ошибки ---------- */
function mistakes(){
  const badMC = MC.filter(q=>(S.mc[q.id]||{}).wrong>0);
  const badQ  = QUIZ.filter(q=>st(q.id).wrong>0 && st(q.id).box<3);
  if(!badMC.length && !badQ.length){
    app.innerHTML = `<div class="card center"><div class="big">✓</div><p>Ошибок нет. Пройди экзамен или карточки, чтобы они здесь появились.</p></div>`;
    return;
  }
  app.innerHTML = `
  ${badMC.length?`<div class="card"><div class="meta">Тест — ошибочные вопросы (${badMC.length})</div>
    ${badMC.map(q=>`<div class="list-item" onclick="this.classList.toggle('open')">
      <div class="t">${esc(q.q)}</div>
      <div class="d"><b style="color:var(--ok)">${'ABCD'[q.correct]}. ${esc(q.options[q.correct])}</b><br>${esc(q.explain_ru)}</div></div>`).join('')}
    <div class="row"><button class="b primary" onclick="drill()">Прогнать эти вопросы заново</button></div></div>`:''}
  ${badQ.length?`<div class="card"><div class="meta">Карточки, которые не даются (${badQ.length})</div>
    ${badQ.map(q=>`<div class="list-item" onclick="this.classList.toggle('open')">
      <div class="t">${q.n}. ${esc(q.q)}</div><div class="d">${esc(q.a_en)}<br><br><span style="color:var(--dim)">${esc(q.a_ru)}</span></div></div>`).join('')}
  </div>`:''}`;
}
function drill(){ const bad = MC.filter(q=>(S.mc[q.id]||{}).wrong>0); go('exam'); ctx.set=shuffle(bad); ctx.answers=[]; ctx.i=0; ctx.t0=Date.now(); ctx.done=false; render(); }

/* ---------- список ---------- */
function list(){
  const term = (ctx.term||'').toLowerCase();
  const found = QUIZ.filter(q => !term || (q.q+q.a_en+q.a_ru).toLowerCase().includes(term));
  app.innerHTML = `<div class="card">
    <input type="text" placeholder="Поиск по вопросам и ответам…" value="${esc(ctx.term||'')}"
      oninput="ctx.term=this.value;render();document.querySelector('input').focus()" style="width:100%">
    <div class="hint">${found.length} из ${QUIZ.length} · нажми на вопрос, чтобы раскрыть ответ</div>
  </div>
  <div class="card">${found.map(q=>`
    <div class="list-item" onclick="this.classList.toggle('open')">
      <div class="t">${q.n}. ${esc(q.q)}</div>
      <div class="d">${esc(q.a_en)}<br><br><span style="color:var(--dim)">${esc(q.a_ru)}</span></div>
    </div>`).join('')}</div>`;
}

/* ---------- служебное ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function render(){ ({home,cards,exam,mistakes,list}[mode])(); }
document.addEventListener('keydown', e=>{
  if(mode==='cards' && ctx.queue){
    if(e.code==='Space'){ e.preventDefault(); if(!ctx.show){ctx.show=1;render();} }
    if(ctx.show && e.key==='1') ansCard(1);
    if(ctx.show && e.key==='2') ansCard(0);
  }
  if(mode==='exam' && ctx.set && !ctx.done){
    const j = 'abcd'.indexOf(e.key.toLowerCase());
    if(j>=0 && ctx.answers[ctx.i]==null) pick(j);
    if(e.code==='Enter' && ctx.answers[ctx.i]!=null) nextQ();
  }
});

/* ---------- загрузка данных ---------- */
function boot(json){ DATA=json; QUIZ=json.quiz; MC=json.mc; render(); }
const embedded = document.getElementById('data');   // есть только в офлайн-сборке dist/
if(embedded){
  boot(JSON.parse(embedded.textContent));
} else {
  fetch('./data.json').then(r=>r.json()).then(boot).catch(()=>{
    app.innerHTML = `<div class="card"><div class="meta">Не загрузились данные</div>
      <p>Файл <code>data.json</code> не найден или заблокирован браузером.</p>
      <p>Если открываешь папку локально через <code>file://</code> — запусти
      <code>python3 -m http.server</code> в корне проекта и открой
      <a href="http://localhost:8000" style="color:var(--acc)">localhost:8000</a>,
      либо возьми готовый офлайн-файл <code>dist/forklift-trainer.html</code>.</p></div>`;
  });
}
</script>
</body>
</html>
